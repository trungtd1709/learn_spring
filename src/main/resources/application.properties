spring.application.name=learn_spring_boot

# MySQL Configuration
spring.datasource.url=jdbc:mysql://103.199.17.186:3306/trung_test
spring.datasource.username=root
spring.datasource.password=Sahua123!@#

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=my-group

# Producer configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer configurations
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.linger-ms=10
logging.level.org.apache.kafka.clients.producer=DEBUG

# ============================================================================
# KAFKA CONSUMER CONFIGURATIONS
# ============================================================================

# Max records per poll - số message tối đa lấy trong 1 lần poll
spring.kafka.consumer.max-poll-records=100

# Auto offset reset: earliest = đọc từ đầu, latest = chỉ đọc message mới
spring.kafka.consumer.auto-offset-reset=earliest

# Disable auto commit - dùng manual commit để đảm bảo message được xử lý
spring.kafka.consumer.enable-auto-commit=false

# Heartbeat interval - consumer gửi heartbeat đến broker
spring.kafka.consumer.properties.heartbeat.interval.ms=3000

# Session timeout - broker coi consumer là dead nếu không nhận heartbeat
spring.kafka.consumer.properties.session.timeout.ms=30000

# Max poll interval - thời gian tối đa giữa 2 lần poll
# Nếu vượt quá, consumer bị coi là dead và partitions được rebalance
spring.kafka.consumer.properties.max.poll.interval.ms=300000

# Fetch configurations
spring.kafka.consumer.properties.fetch.min.bytes=1
spring.kafka.consumer.properties.fetch.max.wait.ms=500

# ============================================================================
# KAFKA PRODUCER ADDITIONAL CONFIGURATIONS
# ============================================================================

# Acks: all = đợi tất cả replicas xác nhận (cao nhất durability)
# 1 = chỉ đợi leader, 0 = không đợi
spring.kafka.producer.acks=all

# Retries - số lần retry khi gửi thất bại
spring.kafka.producer.retries=3

# Retry backoff - thời gian đợi giữa các lần retry
spring.kafka.producer.properties.retry.backoff.ms=1000

# Idempotence - đảm bảo exactly-once semantics
spring.kafka.producer.properties.enable.idempotence=true

# Compression - nén message để giảm network traffic
# Options: none, gzip, snappy, lz4, zstd
spring.kafka.producer.compression-type=snappy

# Max in-flight requests - số request có thể gửi mà chưa nhận ack
# Set = 1 nếu cần đảm bảo ordering tuyệt đối (với idempotence có thể cao hơn)
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# ============================================================================
# LOGGING
# ============================================================================
logging.level.org.apache.kafka.clients.consumer=INFO
logging.level.com.example.learn_spring_boot.core.repository.kafka=DEBUG
